name: Feature request
description: An idea for Red Two, such as an option, a control, a graphics or sound setting, or support for something.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Red Two runs the game's own code, so requests about the PC side (settings, controls, displays, mods) are the easiest to add; changes to the game itself are case by case.

  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What it should do, and where you'd expect to find it (a menu page, a button, a setting).
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: How you'd use it, or what it would fix for you. If another port or emulator (Dolphin, for example) does it, say how.

  - type: input
    id: version
    attributes:
      label: Red Two version
      description: Shown under the menu's title (F1, or the controller's Back / Select button).
      placeholder: "1.2"
